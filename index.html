<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f4f0"><title>プレゼンタイマー</title><style>
:root{font-family:Inter,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#202a28;background:#f5f4f0;--red:#d54b43;--green:#208365;--tone:var(--red)}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e4b65e;outline-offset:4px}.app{max-width:780px;margin:auto;padding:36px 28px 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.eyebrow{font-size:11px;letter-spacing:.19em;color:#7a827c;font-weight:700}h1{font-size:23px;letter-spacing:.03em;margin:7px 0 0}.goal{font-size:12px;color:#727c76;border:1px solid #d8ddd5;border-radius:30px;padding:10px 14px}.card{background:#fff;border:1px solid #e3e6df;border-radius:24px;padding:26px 32px;margin-bottom:16px;box-shadow:0 5px 20px #26392d04}.card-head{display:flex;justify-content:space-between;align-items:center}h2{font-size:16px;margin:0;font-weight:650}.number{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.065em;line-height:1.1}.stop-time{font-size:clamp(64px,12vw,100px);text-align:center;margin:20px 0 15px}.centis{font-size:.42em;letter-spacing:-.04em;color:#929993;margin-left:5px}.badge{font-size:12px;color:var(--tone);background:color-mix(in srgb,var(--tone) 9%,white);padding:7px 10px;border-radius:20px}.track-labels{height:25px;position:relative;font-size:11px;color:#737c76}.track-labels span{position:absolute;transform:translateX(-50%);white-space:nowrap}.track-labels span:last-child{transform:translateX(-100%)}.track{height:15px;background:#eff0ec;border-radius:4px;position:relative;overflow:hidden}.fill{height:100%;background:var(--tone);width:0;transition:background .25s}.marker{position:absolute;width:1px;top:0;bottom:0;background:#fff9}.scale{display:flex;justify-content:space-between;font-size:11px;color:#9aa19b;margin-top:9px}.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:20px;font-size:11px;color:#7b837e;margin-top:18px}.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px}.gear{border:1px solid #e5e8e1;background:white;border-radius:12px;color:#78827b;padding:8px 12px;font-size:12px}.timer-main{display:flex;align-items:center;justify-content:center;gap:36px;margin:20px 0 8px}.count-time{font-size:clamp(56px,10vw,78px)}.timer-note{font-size:12px;color:#8a938b;margin-top:10px}.ring{width:84px;height:84px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:5}.ring .bg{stroke:#edf0e9}.ring .progress{stroke:#6e8675;stroke-linecap:round;stroke-dasharray:226.195;stroke-dashoffset:0}.controls{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:12px;margin-top:24px}.controls button{padding:17px 8px;border-radius:15px;border:1px solid #d9dfd6;font-size:14px;font-weight:600;background:transparent;color:#526157}.controls .primary{background:#253f33;color:#fff;border-color:#253f33}.controls button:disabled{opacity:.35;cursor:default}.foot{display:flex;justify-content:space-between;gap:10px;color:#8c958e;font-size:11px;margin-top:16px}.running{width:6px;height:6px;display:inline-block;background:#a3aaa3;border-radius:50%;margin-right:6px}.active .running{background:#208365;box-shadow:0 0 0 3px #20836518}.overtime{color:var(--red)}dialog{width:min(420px,calc(100% - 32px));border:1px solid #d9dfd6;border-radius:22px;padding:28px;color:#253f33}dialog::backdrop{background:#162c2470}dialog h2{font-size:20px;margin-bottom:22px}label{display:block;font-size:13px;margin:18px 0 8px}input,select{width:100%;padding:12px;border:1px solid #d9dfd6;border-radius:9px;background:white;color:#253f33}.check{display:flex;gap:10px;align-items:center}.check input{width:auto}.dialog-actions{display:flex;gap:12px;margin-top:24px}.dialog-actions button{flex:1;padding:12px;border:1px solid #d9dfd6;border-radius:10px;background:#f5f4f0}.dialog-actions .save{color:white;background:#253f33}#settingsHint{font-size:11px;color:#89948c;line-height:1.8} @media(max-width:500px){.app{padding:23px 16px}.card{padding:23px 22px;border-radius:20px}header{margin-bottom:20px}.goal{padding:8px 10px}.timer-main{gap:22px}.foot{font-size:10px}.legend{gap:12px}.controls{gap:8px}.gear{padding:8px}h1{font-size:21px}}
</style></head><body><main class="app"><header><div><div class="eyebrow">PRESENTATION CLOCK</div><h1>プレゼンタイマー</h1></div><div class="goal">持ち時間 <b>7分</b></div></header>
<section class="card"><div class="card-head"><h2>ストップウォッチ</h2><span class="badge" id="range">4分未満</span></div><div class="number stop-time"><span id="elapsed">00:00</span><span class="centis" id="centis">.00</span></div><div class="track-labels"><span style="left:40%">4分</span><span style="left:70%">7分</span><span style="left:100%">10分</span></div><div class="track" role="progressbar" aria-label="発表の経過時間" aria-valuemin="0" aria-valuemax="600" id="bar"><div class="fill" id="fill"></div><div class="marker" style="left:40%"></div><div class="marker" style="left:70%"></div></div><div class="scale"><span>0分</span><span>10分以降も計測</span></div><div class="legend"><span><i class="dot" style="background:var(--red)"></i>4分未満</span><span><i class="dot" style="background:var(--green)"></i>4分〜10分</span><span><i class="dot" style="background:var(--red)"></i>10分超</span></div></section>
<section class="card"><div class="card-head"><h2 id="timerTitle">6分タイマー</h2><button class="gear" id="settings" aria-label="タイマーとアラーム音の設定">⚙ 設定</button></div><div class="timer-main"><div><div class="number count-time" id="remaining">06:00</div><div class="timer-note" id="timerNote" aria-live="polite">発表終了の1分前をお知らせ</div></div><svg class="ring" viewBox="0 0 84 84" aria-hidden="true"><circle class="bg" cx="42" cy="42" r="36"/><circle class="progress" id="ring" cx="42" cy="42" r="36"/></svg></div></section>
<div class="controls"><button class="primary" id="start">▶ スタート</button><button id="stop" disabled>Ⅱ ストップ</button><button id="reset">↺ リセット</button></div><div class="foot"><span id="state" aria-live="polite"><i class="running"></i>待機中</span><span>スペース：開始 / 停止 · R：リセット</span></div></main>
<dialog id="dialog"><form id="settingsForm"><h2>タイマー設定</h2><label for="minutes">通知する時間（分）</label><input id="minutes" type="number" min="1" max="60" step="1" required value="6"><label class="check"><input id="sound" type="checkbox" checked>時間になったらアラームを鳴らす</label><label for="tone">アラーム音</label><select id="tone"><option value="gentle">やさしいチャイム</option><option value="beep">電子音</option></select><div class="dialog-actions"><button type="button" id="testSound">音を確認</button></div><p id="settingsHint">保存すると、両方の時計を停止してリセットします。<br>アラーム音は端末の音量に合わせて再生されます。</p><div class="dialog-actions"><button type="button" id="cancel">キャンセル</button><button type="submit" class="save">保存する</button></div></form></dialog>
<script src="app.js"></script></body></html>
